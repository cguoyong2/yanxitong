server:
  port: 8080

spring:
  application:
    name: yanxitong-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yanxitong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:yanxitong}
    password: ${DB_PASSWORD:yanxitong}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

payment:
  default-provider: ${PAYMENT_DEFAULT_PROVIDER:MOCK}
  mock-success-enabled: ${PAYMENT_MOCK_SUCCESS_ENABLED:false}
  providers:
    MOCK:
      enabled: true
      callback-secret: ${PAYMENT_MOCK_CALLBACK_SECRET:yanxitong-mock-callback-secret}
    WECHAT_SERVICE_PROVIDER:
      enabled: ${PAYMENT_WECHAT_SP_ENABLED:false}
      merchant-id: ${PAYMENT_WECHAT_MERCHANT_ID:}
      app-id: ${PAYMENT_WECHAT_APP_ID:}
      service-provider-id: ${PAYMENT_WECHAT_SERVICE_PROVIDER_ID:}
      sub-merchant-id: ${PAYMENT_WECHAT_SUB_MERCHANT_ID:}
      sub-app-id: ${PAYMENT_WECHAT_SUB_APP_ID:}
      certificate-serial-no: ${PAYMENT_WECHAT_CERT_SERIAL_NO:}
      callback-secret: ${PAYMENT_WECHAT_CALLBACK_SECRET:}
      private-key-path: ${PAYMENT_WECHAT_PRIVATE_KEY_PATH:}
      api-v3-key: ${PAYMENT_WECHAT_API_V3_KEY:}
      notify-url: ${PAYMENT_WECHAT_NOTIFY_URL:}
      certificate-mode: ${PAYMENT_WECHAT_CERTIFICATE_MODE:AUTO}
      platform-certificate-path: ${PAYMENT_WECHAT_PLATFORM_CERTIFICATE_PATH:}
      wechat-pay-public-key-id: ${PAYMENT_WECHAT_PUBLIC_KEY_ID:}
      wechat-pay-public-key-path: ${PAYMENT_WECHAT_PUBLIC_KEY_PATH:}

wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:${PAYMENT_WECHAT_SUB_APP_ID:${PAYMENT_WECHAT_APP_ID:}}}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET:}
