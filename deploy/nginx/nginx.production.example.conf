limit_req_zone $binary_remote_addr zone=public_entry:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=payment_entry:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=login_entry:10m rate=1r/s;

upstream yanxitong_server {
    server server:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/invitations/public/ {
        limit_req zone=public_entry burst=30 nodelay;
        proxy_pass http://yanxitong_server;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /api/rsvp/submit {
        limit_req zone=public_entry burst=20 nodelay;
        proxy_pass http://yanxitong_server;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /api/gifts/payment-orders {
        limit_req zone=payment_entry burst=8 nodelay;
        proxy_pass http://yanxitong_server;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /api/gifts/offline {
        limit_req zone=public_entry burst=20 nodelay;
        proxy_pass http://yanxitong_server;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /api/auth/login {
        limit_req zone=login_entry burst=10 nodelay;
        proxy_pass http://yanxitong_server;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/ {
        proxy_pass http://yanxitong_server;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://yanxitong_server;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /confirm-screen/ {
        alias /usr/share/nginx/html/confirm-screen/;
        try_files $uri $uri/ /confirm-screen/index.html;
    }

    location / {
        root /usr/share/nginx/html/admin;
        try_files $uri $uri/ /index.html;
    }
}
