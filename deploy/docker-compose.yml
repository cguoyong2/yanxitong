services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yanxitong
      MYSQL_USER: yanxitong
      MYSQL_PASSWORD: yanxitong
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

volumes:
  mysql-data:
