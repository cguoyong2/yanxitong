services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yanxitong}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${DB_USERNAME} -p${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ../server
    restart: unless-stopped
    env_file:
      - ${YANXITONG_ENV_FILE:-./.env.production}
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/yanxitong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.production.example.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_headers.inc:/etc/nginx/conf.d/proxy_headers.inc:ro
      - ../admin/dist:/usr/share/nginx/html/admin:ro
      - ../confirm-screen/dist:/usr/share/nginx/html/confirm-screen:ro
    depends_on:
      - server

volumes:
  mysql-data:
  redis-data:
