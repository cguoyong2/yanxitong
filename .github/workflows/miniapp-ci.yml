name: Miniapp CI

on:
  push:
    branches:
      - main
    paths:
      - "miniapp/**"
      - "deploy/scripts/miniapp-*.mjs"
      - ".github/workflows/miniapp-ci.yml"
  pull_request:
    paths:
      - "miniapp/**"
      - "deploy/scripts/miniapp-*.mjs"
      - ".github/workflows/miniapp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: miniapp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run route and interaction acceptance
        run: npm run check

      - name: Build WeChat miniapp
        run: npm run build
