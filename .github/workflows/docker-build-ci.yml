name: Docker Build CI

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "deploy/docker-compose.production.yml"
      - ".github/workflows/docker-build-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "deploy/docker-compose.production.yml"
      - ".github/workflows/docker-build-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build server image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate production compose config
        working-directory: deploy
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: yanxitong
          DB_USERNAME: yanxitong
          DB_PASSWORD: ci-db-password
          REDIS_PASSWORD: ci-redis-password
          YANXITONG_ENV_FILE: .env.production.example
          HTTP_PORT: 8088
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: false
          tags: yanxitong-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
